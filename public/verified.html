<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Email verified — Niveshaa</title>
<style>
  * { box-sizing: border-box; }
  body {
    margin: 0;
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    background: linear-gradient(135deg, #2E4BDE, #1a2f9e);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    padding: 24px;
  }
  .card {
    background: #ffffff;
    border-radius: 20px;
    padding: 40px 28px;
    max-width: 380px;
    width: 100%;
    text-align: center;
    box-shadow: 0 20px 60px rgba(0,0,0,0.25);
  }
  .check {
    width: 72px;
    height: 72px;
    border-radius: 36px;
    background: #E8FBEF;
    display: flex;
    align-items: center;
    justify-content: center;
    margin: 0 auto 20px;
  }
  .check svg { width: 36px; height: 36px; }
  h1 {
    font-size: 20px;
    color: #14171f;
    margin: 0 0 10px;
  }
  p {
    font-size: 14.5px;
    color: #5a6072;
    line-height: 1.5;
    margin: 0 0 8px;
  }
  .brand {
    margin-top: 28px;
    font-size: 12.5px;
    color: #9aa0b4;
    font-weight: 600;
    letter-spacing: 0.3px;
  }
</style>
</head>
<body>
  <div class="card">
    <div class="check">
      <svg viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
        <path d="M4 12.5L9.5 18L20 6" stroke="#2ecc71" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
      </svg>
    </div>
    <h1>Your email is verified</h1>
    <p>You can close this tab now and head back to the Niveshaa app to log in.</p>
    <div class="brand">NIVESHAA</div>
  </div>
</body>
</html>
